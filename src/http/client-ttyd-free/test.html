<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Public Supabase Realtime Test</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      color: #222;
    }

    h1,
    h2 {
      margin-bottom: 10px;
    }

    section {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 20px;
    }

    input,
    button,
    select {
      box-sizing: border-box;
      font: inherit;
      padding: 10px;
      margin: 4px 0;
    }

    input,
    select {
      width: 100%;
    }

    button {
      cursor: pointer;
      margin-right: 6px;
    }

    button:disabled,
    input:disabled,
    select:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #status {
      padding: 10px;
      border-radius: 5px;
      background: #f1f1f1;
      margin: 12px 0;
      font-weight: 600;
    }

    #messages {
      background: #111;
      color: #00ff66;
      border-radius: 6px;
      min-height: 240px;
      padding: 14px;
      white-space: pre-wrap;
      overflow-x: auto;
      font-family: monospace;
      font-size: 13px;
    }

    .warning {
      color: #9a6700;
      background: #fff8c5;
      padding: 12px;
      border-radius: 6px;
    }

    /* Additional layout styles for topics list and selector elements */
    .topic-container {
      display: flex;
      gap: 12px;
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .topic-chip {
      background: #e9e9e9;
      border: 1px solid #ccc;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .topic-chip:hover {
      background: #ddd;
    }

    .topic-chip.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    .control-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }

    .custom-topic-row {
      display: flex;
      gap: 8px;
      margin: 8px 0 16px 0;
    }

    .custom-topic-row input {
      flex: 1;
    }

    .custom-topic-row button {
      margin-right: 0;
      white-space: nowrap;
    }

    #connectToggleBtn {
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <h1>Public Supabase Realtime Test</h1>

  <section>
    <h2>Connection</h2>

    <p class="warning">
      This is a public channel. Anyone who knows the topic can connect,
      receive messages, and send messages.
    </p>

    <!-- List to other topics -->
    <p>Other Live Topics:</p>
    <div id="topicList" class="topic-container"></div>

    <!-- Custom topic input field option -->
    <p>Add Custom Topic:</p>
    <div class="custom-topic-row">
      <input 
        id="customTopicInput" 
        type="text" 
        placeholder="e.g., public:room:my-custom-room"
      >
      <button id="addTopicBtn">Add Topic</button>
    </div>

    <!-- Option to connect to other real time topic & single button execution -->
    <div class="control-row">
      <select id="topicSelect"></select>
      <button id="connectToggleBtn">Connect</button>
    </div>

    <p>
      Topic:
      <code id="topicDisplay">public:room:arvind</code>
    </p>

    <div id="status">Disconnected</div>
  </section>

  <section>
    <h2>Broadcast Message</h2>

    <input
      id="messageInput"
      type="text"
      placeholder="Type a message"
      disabled
    >

    <button id="sendButton" disabled>
      Send broadcast
    </button>

    <h3>Event log</h3>
    <pre id="messages"></pre>
  </section>

  <script type="module">
    import { createClient } from
      'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const SUPABASE_URL =
      'https://dabwulkpyquthvearbfw.supabase.co'

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_1V4Zaw720lrIPx8IqmuxmA_ri32Bdqu'

    // Supported target topics for structural multi-channel testing
    const AVAILABLE_TOPICS = [
      'public:room:arvind',
      'public:room:general',
      'public:room:lobby',
      'public:room:alerts'
    ]

    let currentTopic = 'public:room:arvind'
    const BROADCAST_EVENT = 'message_sent'

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    )

    const statusOutput = document.querySelector('#status')
    const messagesOutput = document.querySelector('#messages')
    const messageInput = document.querySelector('#messageInput')
    const sendButton = document.querySelector('#sendButton')
    
    // New UI control selectors
    const topicListContainer = document.querySelector('#topicList')
    const topicSelectDropdown = document.querySelector('#topicSelect')
    const connectToggleBtn = document.querySelector('#connectToggleBtn')
    const topicDisplay = document.querySelector('#topicDisplay')
    
    // Custom input element selectors
    const customTopicInput = document.querySelector('#customTopicInput')
    const addTopicBtn = document.querySelector('#addTopicBtn')

    let channel = null

    // Generates UI anchors for the subject lists and options dropdown
    function renderTopicSelectors() {
      topicListContainer.innerHTML = ''
      topicSelectDropdown.innerHTML = ''

      AVAILABLE_TOPICS.forEach(topic => {
        // Build interactive topic list items
        const chip = document.createElement('div')
        chip.className = `topic-chip${topic === currentTopic ? ' active' : ''}`
        chip.textContent = topic.replace('public:room:', '')
        chip.addEventListener('click', () => {
          if (!channel) {
            currentTopic = topic
            updateTopicUI()
          }
        })
        topicListContainer.appendChild(chip)

        // Build standard option input select mapping
        const option = document.createElement('option')
        option.value = topic
        option.textContent = topic
        option.selected = (topic === currentTopic)
        topicSelectDropdown.appendChild(option)
      })
    }

    // Dynamic text syncing based on selection hooks
    function updateTopicUI() {
      topicDisplay.textContent = currentTopic
      renderTopicSelectors()
    }

    // Toggle dropdown accessibility depending on active connection channel state
    function setControlsLock(locked) {
      topicSelectDropdown.disabled = locked
      customTopicInput.disabled = locked
      addTopicBtn.disabled = locked
      const chips = document.querySelectorAll('.topic-chip')
      chips.forEach(chip => {
        if (locked) {
          chip.style.pointerEvents = 'none'
          chip.style.opacity = '0.6'
        } else {
          chip.style.pointerEvents = 'auto'
          chip.style.opacity = '1'
        }
      })
    }

    function writeLog(message, value = null) {
      let output = message

      if (value !== null && value !== undefined) {
        if (typeof value === 'string') {
          output += ` ${value}`
        } else {
          output += ` ${JSON.stringify(value, null, 2)}`
        }
      }

      messagesOutput.textContent += `${output}
`
      messagesOutput.scrollTop = messagesOutput.scrollHeight

      console.log(output)
    }

    function setStatus(message) {
      statusOutput.textContent = message
      writeLog(`[status] ${message}`)
    }

    function setMessagingEnabled(enabled) {
      messageInput.disabled = !enabled
      sendButton.disabled = !enabled
    }

    function getErrorMessage(error) {
      if (!error) {
        return ''
      }

      if (typeof error === 'string') {
        return error
      }

      return (
        error.message ||
        error.reason ||
        error.code ||
        String(error)
      )
    }

    function connectToPublicChannel() {
      writeLog(`[channel] subscribing to ${currentTopic}`)

      /*
       * No private: true.
       *
       * This is intentionally a public channel and does not require
       * a signed-in Supabase Auth session.
       */
      channel = supabase.channel(currentTopic, {
        config: {
          broadcast: {
            self: true,
            ack: true
          }
        }
      })

      channel.on(
        'broadcast',
        { event: BROADCAST_EVENT },
        (payload) => {
          writeLog('[broadcast received]', payload)
        }
      )

      channel.subscribe((subscriptionStatus, error) => {
        const errorMessage = getErrorMessage(error)

        if (errorMessage) {
          writeLog(
            `[channel] ${subscriptionStatus} — ${errorMessage}`
          )
        } else {
          writeLog(`[channel] ${subscriptionStatus}`)
        }

        if (subscriptionStatus === 'SUBSCRIBED') {
          setStatus(`Connected to public ${currentTopic}`)
          setMessagingEnabled(true)
          connectToggleBtn.textContent = 'Disconnect'
          setControlsLock(true)
        } else if (subscriptionStatus === 'CHANNEL_ERROR') {
          setStatus(
            errorMessage
              ? `Channel error: ${errorMessage}`
              : 'Channel error. Check that public access is enabled.'
          )

          setMessagingEnabled(false)
          disconnectFromChannel()
        } else {
          setStatus(`Channel status: ${subscriptionStatus}`)
          setMessagingEnabled(false)
        }
      })
    }

    function disconnectFromChannel() {
      if (channel) {
        writeLog(`[channel] removing channel subscription for ${currentTopic}`)
        supabase.removeChannel(channel)
        channel = null
      }
      setStatus('Disconnected')
      setMessagingEnabled(false)
      connectToggleBtn.textContent = 'Connect'
      setControlsLock(false)
    }

    async function sendMessage() {
      const text = messageInput.value.trim()

      if (!text) {
        return
      }

      if (!channel) {
        writeLog('[send error] No active channel')
        return
      }

      if (channel.state !== 'joined') {
        writeLog(
          `[send error] Channel is not subscribed. Current state: ${channel.state}`
        )
        return
      }

      const payload = {
        text,
        sent_at: new Date().toISOString()
      }

      writeLog('[broadcast] sending', payload)

      const result = await channel.send({
        type: 'broadcast',
        event: BROADCAST_EVENT,
        payload
      })

      if (result !== 'ok') {
        writeLog('[broadcast error]', result)
        return
      }

      writeLog('[broadcast] sent successfully')

      messageInput.value = ''
      messageInput.focus()
    }

    // Handles adding custom inputs into our active option streams array
    function addCustomTopic() {
      const newTopic = customTopicInput.value.trim()
      
      if (!newTopic) {
        return
      }

      // Add to array if it isn't already included
      if (!AVAILABLE_TOPICS.includes(newTopic)) {
        AVAILABLE_TOPICS.push(newTopic)
      }

      // Set custom topic as current selection and re-render UI
      currentTopic = newTopic
      updateTopicUI()
      
      // Clear field
      customTopicInput.value = ''
      writeLog(`[input] added and selected custom topic: ${newTopic}`)
    }

    // Custom topic add triggers
    addTopicBtn.addEventListener('click', addCustomTopic)
    customTopicInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addCustomTopic()
      }
    })

    // Toggle real time topic orchestration via single action button hook
    connectToggleBtn.addEventListener('click', () => {
      if (channel) {
        disconnectFromChannel()
      } else {
        connectToPublicChannel()
      }
    })

    // Dropdown input switch handling
    topicSelectDropdown.addEventListener('change', (event) => {
      currentTopic = event.target.value
      updateTopicUI()
    })

    sendButton.addEventListener('click', sendMessage)

    messageInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        sendMessage()
      }
    })

    window.addEventListener('beforeunload', () => {
      if (channel) {
        supabase.removeChannel(channel)
      }
    })

    // Prepare elements locally on execution layout initialization
    updateTopicUI()
  </script>
</body>
</html>
